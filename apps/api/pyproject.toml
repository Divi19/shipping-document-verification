[project]
name = "shipping-document-verification-api"
version = "0.1.0"
description = "FastAPI service for shipping document verification"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "markdown>=3.7",
  "google-generativeai>=0.8.0",
  "aiohttp>=3.9.0",
  "diskcache>=5.6.0",
  "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]
# Docling is optional - install with: pip install docling
# It has heavy dependencies (torch, etc.) so we make it optional
docling = [
  "docling>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["app", "scripts", "tests"]
python_version = "3.12"
strict = true
