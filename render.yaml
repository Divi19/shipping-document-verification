services:
  - type: web
    name: shipping-document-verification-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLE_FALLBACK
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: SDOC_DATA_DIR
        value: /app/data
